name: Terraform Feature Pipeline

on:
  push:
    branches:
      - main
      - features

permissions:
  id-token: write
  contents: read

jobs:
  scan:
    name: Terraform Scan
    runs-on: [self-hosted, Windows, X64]

    steps:

      # ==========================================================
      # 1. Checkout repository
      # ==========================================================
      - name: Checkout code
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init .
          git remote add origin "https://x-access-token:$env:GH_TOKEN@github.com/${{ github.repository }}.git"
          git fetch --depth=1 origin $env:GITHUB_SHA
          git checkout --detach $env:GITHUB_SHA


      # ==========================================================
      # 2. Verify required tools
      # ==========================================================
      - name: Verify Tools
        shell: powershell
        run: |
          Write-Host "Checking Azure CLI..."
          az version

          Write-Host "Checking Terraform..."
          terraform version

          Write-Host "Checking TFLint..."
          tflint --version


      # ==========================================================
      # 3. Initialize TFLint
      # ==========================================================
      - name: Initialize TFLint
        shell: powershell
        run: |
          tflint --init


      # ==========================================================
      # 4. Run TFLint
      # ==========================================================
      - name: Run TFLint
        shell: powershell
        run: |
          tflint --recursive


      # ==========================================================
      # 5. Get GitHub OIDC Token
      # ==========================================================
      - name: Get OIDC Token
        shell: powershell
        env:
          ACTIONS_ID_TOKEN_REQUEST_URL: ${{ env.ACTIONS_ID_TOKEN_REQUEST_URL }}
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ${{ env.ACTIONS_ID_TOKEN_REQUEST_TOKEN }}
        run: |
          Write-Host "GitHub OIDC permission enabled."
          Write-Host "OIDC token request environment is available."


      # ==========================================================
      # 6. Azure Login using OIDC
      # ==========================================================
      - name: Azure Login using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}


      # ==========================================================
      # 7. Verify Azure Login
      # ==========================================================
      - name: Verify Azure Login
        shell: powershell
        run: |
          az account show


      # ==========================================================
      # 8. Set Azure Subscription
      # ==========================================================
      - name: Set Azure Subscription
        shell: powershell
        run: |
          az account set --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}"


      # ==========================================================
      # 9. Verify Azure Subscription
      # ==========================================================
      - name: Verify Subscription
        shell: powershell
        run: |
          az account show --query "{Name:name, Subscription:id, Tenant:tenantId}" -o table


      # ==========================================================
      # 10. Terraform Init
      # ==========================================================
      - name: Terraform Init
        shell: powershell
        run: |
          terraform init


      # ==========================================================
      # 11. Terraform Validate
      # ==========================================================
      - name: Terraform Validate
        shell: powershell
        run: |
          terraform validate


      # ==========================================================
      # 12. Terraform Plan
      # ==========================================================
      - name: Terraform Plan
        shell: powershell
        run: |
          terraform plan
        #final 