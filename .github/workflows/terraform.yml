name: Terraform Feature Pipeline

on:
  push:
    branches:
      - main
      - features

permissions:
  id-token: write
  contents: read

jobs:
  scan:
    name: Terraform Scan
    runs-on: [self-hosted, Windows, X64]

    steps:

      # ==========================================
      # 1. Checkout Repository
      # ==========================================
      - name: Checkout code
        uses: actions/checkout@v4

      # ==========================================
      # 2. Verify Workspace
      # ==========================================
      - name: Verify Workspace
        shell: powershell
        run: |
          Write-Host "===================================="
          Write-Host "GitHub Workspace"
          Write-Host "===================================="

          Write-Host "Workspace:"
          Write-Host $env:GITHUB_WORKSPACE

          Write-Host "Current Directory:"
          Get-Location

          Write-Host ""
          Write-Host "Repository Files:"
          Get-ChildItem -Path $env:GITHUB_WORKSPACE

          Write-Host ""
          Write-Host "Terraform Files:"
          Get-ChildItem -Path $env:GITHUB_WORKSPACE -Filter *.tf -Recurse

      # ==========================================
      # 3. Verify Terraform
      # ==========================================
      - name: Verify Terraform
        shell: powershell
        working-directory: ${{ github.workspace }}
        run: |
          Write-Host "Terraform Version:"
          terraform version

      # ==========================================
      # 4. Verify TFLint
      # ==========================================
      - name: Verify TFLint
        shell: powershell
        working-directory: ${{ github.workspace }}
        run: |
          Write-Host "TFLint Version:"
          tflint --version

      # ==========================================
      # 5. Initialize TFLint
      # ==========================================
      - name: Initialize TFLint
        shell: powershell
        working-directory: ${{ github.workspace }}
        run: |
          Write-Host "Initializing TFLint..."

          tflint --init

          if ($LASTEXITCODE -ne 0) {
            Write-Error "TFLint initialization failed."
            exit 1
          }

          Write-Host "TFLint initialization completed."

      # ==========================================
      # 6. Run TFLint
      # ==========================================
      - name: Run TFLint
        shell: powershell
        working-directory: ${{ github.workspace }}
        run: |
          Write-Host "Running TFLint..."

          tflint --recursive

          if ($LASTEXITCODE -ne 0) {
            Write-Error "TFLint scan failed."
            exit 1
          }

          Write-Host "TFLint scan completed successfully."

      # ==========================================
      # 7. Get GitHub OIDC Token
      # ==========================================
      - name: Get OIDC Token
        shell: powershell
        env:
          ACTIONS_ID_TOKEN_REQUEST_URL: ${{ env.ACTIONS_ID_TOKEN_REQUEST_URL }}
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ${{ env.ACTIONS_ID_TOKEN_REQUEST_TOKEN }}
        run: |
          Write-Host "GitHub OIDC token endpoint:"
          Write-Host $env:ACTIONS_ID_TOKEN_REQUEST_URL

          if ([string]::IsNullOrWhiteSpace($env:ACTIONS_ID_TOKEN_REQUEST_URL)) {
            Write-Error "ACTIONS_ID_TOKEN_REQUEST_URL is empty."
            exit 1
          }

          if ([string]::IsNullOrWhiteSpace($env:ACTIONS_ID_TOKEN_REQUEST_TOKEN)) {
            Write-Error "ACTIONS_ID_TOKEN_REQUEST_TOKEN is empty."
            exit 1
          }

          Write-Host "OIDC environment variables are available."

      # ==========================================
      # 8. Azure Login using OIDC
      # ==========================================
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # ==========================================
      # 9. Verify Azure Login
      # ==========================================
      - name: Verify Azure Login
        shell: powershell
        run: |
          Write-Host "Checking Azure login..."

          az account show

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Azure login verification failed."
            exit 1
          }

          Write-Host "Azure login successful."

      # ==========================================
      # 10. Terraform Init
      # ==========================================
      - name: Terraform Init
        shell: powershell
        working-directory: ${{ github.workspace }}
        run: |
          Write-Host "===================================="
          Write-Host "Terraform Init"
          Write-Host "===================================="

          Write-Host "Current Directory:"
          Get-Location

          Write-Host ""
          Write-Host "Terraform Files:"
          Get-ChildItem -Path $env:GITHUB_WORKSPACE -Filter *.tf

          Write-Host ""
          Write-Host "Initializing Terraform..."

          terraform init -input=false

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Terraform init failed."
            exit 1
          }

          Write-Host "Terraform init completed successfully."

      # ==========================================
      # 11. Terraform Validate
      # ==========================================
      - name: Terraform Validate
        shell: powershell
        working-directory: ${{ github.workspace }}
        run: |
          Write-Host "===================================="
          Write-Host "Terraform Validate"
          Write-Host "===================================="

          Write-Host "Current Directory:"
          Get-Location

          Write-Host ""
          Write-Host "Terraform Files:"
          Get-ChildItem -Path $env:GITHUB_WORKSPACE -Filter *.tf

          Write-Host ""
          Write-Host "Validating Terraform configuration..."

          terraform validate

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Terraform validation failed."
            exit 1
          }

          Write-Host ""
          Write-Host "Terraform validation completed successfully."

      # ==========================================
      # 12. Terraform Plan
      # ==========================================
      - name: Terraform Plan
        shell: powershell
        working-directory: ${{ github.workspace }}
        run: |
          Write-Host "===================================="
          Write-Host "Terraform Plan"
          Write-Host "===================================="

          Write-Host "Current Directory:"
          Get-Location

          Write-Host ""
          Write-Host "GitHub Workspace:"
          Write-Host $env:GITHUB_WORKSPACE

          Write-Host ""
          Write-Host "Terraform Files:"
          Get-ChildItem -Path $env:GITHUB_WORKSPACE -Filter *.tf -Recurse

          Write-Host ""
          Write-Host "Creating Terraform plan..."

          terraform plan -input=false

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Terraform plan failed."
            exit 1
          }

          Write-Host ""
          Write-Host "Terraform plan completed successfully."

      # ==========================================
      # 13. Finish
      # ==========================================
      - name: Pipeline Completed
        shell: powershell
        run: |
          Write-Host "===================================="
          Write-Host "Terraform Pipeline Completed"
          Write-Host "===================================="