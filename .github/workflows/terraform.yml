name: Terraform Feature Pipeline

on:
  push:
    branches:
      - main
      - features

permissions:
  id-token: write
  contents: read

jobs:
  scan:
    name: Terraform Scan
    runs-on: [self-hosted, Windows, X64]

    steps:

      # 1. Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4


      # 2. Install TFLint
      - name: Install TFLint
        shell: powershell
        run: |
          winget install --id TerraformLinters.tflint --exact --accept-source-agreements --accept-package-agreements


      # 3. Verify TFLint
      - name: Verify TFLint
        shell: powershell
        run: |
          tflint --version


      # 4. Initialize TFLint
      - name: Initialize TFLint
        shell: powershell
        run: |
          tflint --init


      # 5. Run TFLint
      - name: Run TFLint
        shell: powershell
        run: |
          tflint --recursive


      # 6. Login to Azure using GitHub OIDC
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}


      # 7. Verify Azure Login
      - name: Verify Azure Login
        shell: powershell
        run: |
          az account show


      # 8. Setup Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3


      # 9. Terraform Init
      - name: Terraform Init
        shell: powershell
        run: |
          terraform init


      # 10. Terraform Validate
      - name: Terraform Validate
        shell: powershell
        run: |
          terraform validate


      # 11. Terraform Plan
      - name: Terraform Plan
        shell: powershell
        run: |
          terraform plan