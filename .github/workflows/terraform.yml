name: Terraform Feature Pipeline

on:
  push:
    branches:
      - main
      - features

permissions:
  id-token: write
  contents: read

jobs:
  scan:
    name: Terraform Scan
    runs-on: [self-hosted, Windows, X64]

    steps:

      # ==========================================================
      # 1. Checkout repository manually
      # ==========================================================
      - name: Checkout code
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $repo = "https://github.com/${{ github.repository }}.git"

          Write-Host "Initializing Git repository..."
          git init .

          Write-Host "Adding GitHub remote..."
          git remote add origin $repo

          Write-Host "Preparing GitHub authentication..."
          $auth = [Convert]::ToBase64String(
            [Text.Encoding]::ASCII.GetBytes("x-access-token:$env:GH_TOKEN")
          )

          Write-Host "Fetching repository..."
          git -c http.extraheader="AUTHORIZATION: basic $auth" fetch --depth=1 origin $env:GITHUB_SHA

          Write-Host "Checking out commit..."
          git checkout --detach $env:GITHUB_SHA

          Write-Host "Repository checkout completed."


      # ==========================================================
      # 2. Verify installed tools
      # ==========================================================
      - name: Verify Tools
        shell: powershell
        run: |
          Write-Host "===== Azure CLI ====="
          az version

          Write-Host "===== Terraform ====="
          terraform version

          Write-Host "===== TFLint ====="
          tflint --version


      # ==========================================================
      # 3. Initialize TFLint
      # ==========================================================
      - name: Initialize TFLint
        shell: powershell
        run: |
          tflint --init


      # ==========================================================
      # 4. Run TFLint
      # ==========================================================
      - name: Run TFLint
        shell: powershell
        run: |
          tflint --recursive


      # ==========================================================
      # 5. Request GitHub OIDC token
      # ==========================================================
      - name: Get OIDC Token
        shell: powershell
        env:
          OIDC_URL: ${{ env.ACTIONS_ID_TOKEN_REQUEST_URL }}
          OIDC_TOKEN: ${{ env.ACTIONS_ID_TOKEN_REQUEST_TOKEN }}
        run: |
          Write-Host "Requesting GitHub OIDC token..."

          $url = "$env:OIDC_URL&audience=api://AzureADTokenExchange"

          $response = Invoke-RestMethod `
            -Uri $url `
            -Method Get `
            -Headers @{
              Authorization = "Bearer $env:OIDC_TOKEN"
            }

          $response.value | Out-File -FilePath "$env:RUNNER_TEMP\azure-oidc-token.txt" -Encoding ascii

          Write-Host "OIDC token received successfully."


      # ==========================================================
      # 6. Login to Azure using OIDC
      # ==========================================================
      - name: Azure Login using OIDC
        shell: powershell
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          $federatedToken = Get-Content "$env:RUNNER_TEMP\azure-oidc-token.txt" -Raw

          Write-Host "Logging into Azure..."

          az login `
            --service-principal `
            --username $env:AZURE_CLIENT_ID `
            --tenant $env:AZURE_TENANT_ID `
            --federated-token $federatedToken

          Write-Host "Azure login successful."


      # ==========================================================
      # 7. Set Azure subscription
      # ==========================================================
      - name: Set Azure Subscription
        shell: powershell
        env:
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          az account set --subscription $env:AZURE_SUBSCRIPTION_ID

          Write-Host "Azure subscription selected."


      # ==========================================================
      # 8. Verify Azure login
      # ==========================================================
      - name: Verify Azure Login
        shell: powershell
        run: |
          az account show


      # ==========================================================
      # 9. Terraform Init
      # ==========================================================
      - name: Terraform Init
        shell: powershell
        run: |
          terraform init


      # ==========================================================
      # 10. Terraform Validate
      # ==========================================================
      - name: Terraform Validate
        shell: powershell
        run: |
          terraform validate


      # ==========================================================
      # 11. Terraform Plan
      # ==========================================================
      - name: Terraform Plan
        shell: powershell
        run: |
          terraform plan