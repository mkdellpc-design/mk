name: Terraform Feature Pipeline

on:
  push:
    branches:
      - main
      - features

permissions:
  id-token: write
  contents: read

jobs:
  scan:
    name: Terraform Scan
    runs-on: [self-hosted, Windows, X64]

    steps:

      # ==========================================================
      # 1. Checkout repository manually
      # ==========================================================
      - name: Checkout code
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Write-Host "Starting repository checkout..."

          if (Test-Path ".git") {
            Write-Host "Removing previous Git metadata..."
            Remove-Item ".git" -Recurse -Force
          }

          git init .

          git remote add origin "https://github.com/${{ github.repository }}.git"

          $auth = [Convert]::ToBase64String(
            [Text.Encoding]::ASCII.GetBytes("x-access-token:$env:GH_TOKEN")
          )

          Write-Host "Fetching GitHub repository..."

          git -c http.extraheader="AUTHORIZATION: basic $auth" `
            fetch --depth=1 origin $env:GITHUB_SHA

          git checkout --detach $env:GITHUB_SHA

          Write-Host "Cleaning untracked files..."

          git clean -fdx

          Write-Host "Repository checkout completed."


      # ==========================================================
      # 2. Verify installed tools
      # ==========================================================
      - name: Verify Tools
        shell: powershell
        run: |
          Write-Host "===================================="
          Write-Host "Azure CLI"
          Write-Host "===================================="
          az version

          Write-Host "===================================="
          Write-Host "Terraform"
          Write-Host "===================================="
          terraform version

          Write-Host "===================================="
          Write-Host "TFLint"
          Write-Host "===================================="
          tflint --version


      # ==========================================================
      # 3. Initialize TFLint
      # ==========================================================
      - name: Initialize TFLint
        shell: powershell
        run: |
          Write-Host "Initializing TFLint..."

          tflint --init

          Write-Host "TFLint initialization completed."


      # ==========================================================
      # 4. Run TFLint
      # ==========================================================
      - name: Run TFLint
        shell: powershell
        run: |
          Write-Host "Running TFLint..."

          tflint --recursive

          Write-Host "TFLint completed."


      # ==========================================================
      # 5. Get GitHub OIDC Token
      # ==========================================================
      - name: Get OIDC Token
        shell: powershell
        run: |
          Write-Host "Requesting GitHub OIDC token..."

          if ([string]::IsNullOrWhiteSpace($env:ACTIONS_ID_TOKEN_REQUEST_URL)) {
            Write-Error "ACTIONS_ID_TOKEN_REQUEST_URL is empty."
            exit 1
          }

          if ([string]::IsNullOrWhiteSpace($env:ACTIONS_ID_TOKEN_REQUEST_TOKEN)) {
            Write-Error "ACTIONS_ID_TOKEN_REQUEST_TOKEN is empty."
            exit 1
          }

          $oidcUrl = "$env:ACTIONS_ID_TOKEN_REQUEST_URL&audience=api://AzureADTokenExchange"

          Write-Host "OIDC request URL is available."

          $response = Invoke-RestMethod `
            -Uri $oidcUrl `
            -Method Get `
            -Headers @{
              Authorization = "Bearer $env:ACTIONS_ID_TOKEN_REQUEST_TOKEN"
            }

          if ([string]::IsNullOrWhiteSpace($response.value)) {
            Write-Error "GitHub OIDC token was not returned."
            exit 1
          }

          $tokenPath = Join-Path $env:RUNNER_TEMP "azure-oidc-token.txt"

          $response.value | Out-File `
            -FilePath $tokenPath `
            -Encoding ascii `
            -NoNewline

          Write-Host "GitHub OIDC token received successfully."


      # ==========================================================
      # 6. Azure Login using OIDC
      # ==========================================================
      - name: Azure Login using OIDC
        shell: powershell
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: |
          Write-Host "Logging into Azure using federated identity..."

          $tokenPath = Join-Path $env:RUNNER_TEMP "azure-oidc-token.txt"

          if (-not (Test-Path $tokenPath)) {
            Write-Error "OIDC token file was not found."
            exit 1
          }

          $federatedToken = Get-Content $tokenPath -Raw

          az login `
            --service-principal `
            --username $env:AZURE_CLIENT_ID `
            --tenant $env:AZURE_TENANT_ID `
            --federated-token $federatedToken

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Azure login failed."
            exit 1
          }

          Write-Host "Azure login successful."


      # ==========================================================
      # 7. Set Azure Subscription
      # ==========================================================
      - name: Set Azure Subscription
        shell: powershell
        env:
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          Write-Host "Setting Azure subscription..."

          az account set `
            --subscription $env:AZURE_SUBSCRIPTION_ID

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Failed to set Azure subscription."
            exit 1
          }

          Write-Host "Azure subscription selected."


      # ==========================================================
      # 8. Verify Azure Login
      # ==========================================================
      - name: Verify Azure Login
        shell: powershell
        run: |
          Write-Host "Verifying Azure authentication..."

          az account show `
            --query "{Name:name, Subscription:id, Tenant:tenantId}" `
            -o table

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Azure account verification failed."
            exit 1
          }


      # ==========================================================
      # 9. Terraform Init
      # ==========================================================
      - name: Terraform Init
        shell: powershell
        run: |
          Write-Host "Initializing Terraform..."

          terraform init -input=false

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Terraform init failed."
            exit 1
          }

          Write-Host "Terraform init completed."


      # ==========================================================
      # 10. Terraform Validate
      # ==========================================================
      - name: Terraform Validate
        shell: powershell
        run: |
          Write-Host "Validating Terraform configuration..."

          terraform validate

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Terraform validation failed."
            exit 1
          }

          Write-Host "Terraform validation completed."


      # ==========================================================
      # 11. Terraform Plan
      # ==========================================================
      - name: Terraform Plan
        shell: powershell
        run: |
          Write-Host "Creating Terraform plan..."

          terraform plan -input=false

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Terraform plan failed."
            exit 1
          }

          Write-Host "Terraform plan completed successfully."