name: Terraform Feature Pipeline

on:
  push:
    branches:
      - main
      - features

permissions:
  id-token: write
  contents: read

jobs:
  scan:
    name: Terraform Scan
    runs-on: [self-hosted, Windows, X64]

    steps:

      # 1. Checkout repository
      - name: Checkout code
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init .
          git remote add origin "https://github.com/${{ github.repository }}.git"
          git -c http.extraheader="AUTHORIZATION: bearer $env:GH_TOKEN" fetch --depth=1 origin $env:GITHUB_SHA
          git checkout --detach $env:GITHUB_SHA


      # 2. Verify installed tools
      - name: Verify Tools
        shell: powershell
        run: |
          az version
          terraform version
          tflint --version


      # 3. Initialize TFLint
      - name: Initialize TFLint
        shell: powershell
        run: |
          tflint --init


      # 4. Run TFLint
      - name: Run TFLint
        shell: powershell
        run: |
          tflint --recursive


      # 5. Get GitHub OIDC Token
      - name: Get OIDC Token
        shell: powershell
        env:
          ACTIONS_ID_TOKEN_REQUEST_URL: ${{ env.ACTIONS_ID_TOKEN_REQUEST_URL }}
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ${{ env.ACTIONS_ID_TOKEN_REQUEST_TOKEN }}
        run: |
          $url = "$env:ACTIONS_ID_TOKEN_REQUEST_URL&audience=api://AzureADTokenExchange"

          $response = Invoke-RestMethod `
            -Uri $url `
            -Headers @{
              Authorization = "Bearer $env:ACTIONS_ID_TOKEN_REQUEST_TOKEN"
            }

          $response.value | Out-File -FilePath "$env:RUNNER_TEMP\azure-oidc-token.txt" -Encoding ascii


      # 6. Login to Azure using OIDC
      - name: Azure Login using OIDC
        shell: powershell
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: |
          $FEDERATED_TOKEN = Get-Content "$env:RUNNER_TEMP\azure-oidc-token.txt"

          az login `
            --service-principal `
            --username $env:AZURE_CLIENT_ID `
            --tenant $env:AZURE_TENANT_ID `
            --federated-token $FEDERATED_TOKEN


      # 7. Select Azure Subscription
      - name: Set Azure Subscription
        shell: powershell
        env:
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          az account set --subscription $env:AZURE_SUBSCRIPTION_ID


      # 8. Verify Azure Login
      - name: Verify Azure Login
        shell: powershell
        run: |
          az account show


      # 9. Terraform Init
      - name: Terraform Init
        shell: powershell
        run: |
          terraform init


      # 10. Terraform Validate
      - name: Terraform Validate
        shell: powershell
        run: |
          terraform validate


      # 11. Terraform Plan
      - name: Terraform Plan
        shell: powershell
        run: |
          terraform plan